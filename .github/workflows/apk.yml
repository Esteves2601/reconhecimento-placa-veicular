# Gera o APK do placas na nuvem (buildozer nao roda no Windows).
# Buildozer instalado direto no runner (a action Docker de terceiros
# quebrou: "Docker build failed"). Runner pinado no 24.04 para fugir da
# migracao do ubuntu-latest para 26.04.
# - Push com mudanca em mobile_app/** OU botao Run workflow: builda o APK
#   debug, anexa como Artifact e publica Release (download direto,
#   sem login) por padrao.
# O APK debug instala com avisos do Play Protect (certificado debug).
# O release limpo (keystore proprio) entra depois via Secrets.

name: APK Placas

on:
  # Push NAO dispara build (APK fora da vitrine por enquanto).
  # Build manual: Actions > APK Placas > Run workflow.
  workflow_dispatch:
    inputs:
      release:
        description: "Publicar Release (download direto no celular)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Copiar motor para mobile_app
        run: |
          cp Motor.py Main.py DetectarPlacas.py DetectarCaracteres.py \
             Preprocesso.py PossivelPlaca.py PossivelCaractere.py \
             classifications.txt flattened_images.txt mobile_app/
          mkdir -p mobile_app/amostras
          cp imagens/5.png imagens/6.png imagens/9.png imagens/13.png \
             mobile_app/amostras/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake \
            libffi-dev libssl-dev libltdl-dev

      - name: Instalar buildozer
        run: |
          pip install --user --break-system-packages \
            buildozer cython==0.29.33
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build APK debug
        working-directory: mobile_app
        run: |
          set -o pipefail
          buildozer android debug 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Publicar diagnostico da falha
        if: failure()
        run: |
          python3 - "$GITHUB_WORKSPACE/build.log" <<'EOF'
          import re, sys
          txt = open(sys.argv[1], encoding="utf-8",
                     errors="replace").read()
          linhas = [l for l in txt.splitlines() if l.strip()]
          # remove o despejo de ambiente do buildozer (polui a cauda)
          uteis = [l for l in linhas
                   if not re.match(r"^#\s+[A-Z_]+ = ", l)]
          # blocos de traceback com contexto
          blocos = []
          for i, l in enumerate(uteis):
              if ("Traceback" in l or "Command failed" in l
                      or "CalledProcessError" in l):
                  blocos += uteis[max(0, i - 2):i + 12]
          chaves = [l for l in uteis
                    if re.search(r"(Error|error:|Exception|FAILED|"
                                 r"E: |sdkmanager|BUILD FAILED"
                                 r"|ninja: build stopped)", l)
                    and "errorlevel" not in l.lower()
                    and "raise" not in l][-15:]
          partes = []
          if blocos:
              partes.append("--- traceback/comando ---\n"
                            + "\n".join(blocos[:40]))
          if chaves:
              partes.append("--- erros ---\n" + "\n".join(chaves))
          partes.append("--- cauda ---\n"
                        + "\n".join(uteis[-40:]))
          msg = ("FALHA BUILD-APK\n"
                 + "\n".join(partes))
          msg = (msg.replace("%", "%25").replace("\r", "%0D")
                    .replace("\n", "%0A"))[:30000]
          print(f"::error::{msg}")
          EOF

      - name: Anexar log completo (Artifact)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Anexar APK (Artifact)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: placas-debug
          path: mobile_app/bin/*.apk

      - name: Publicar Release
        # Push publica sempre; no disparo manual, a caixa controla.
        # (No push o contexto inputs nao existe, por isso o teste direto
        # com inputs.release falhava e pulava a Release.)
        if: ${{ success() && (github.event_name != 'workflow_dispatch'
          || inputs.release != false) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-debug-${{ github.run_number }}
          name: Placas debug ${{ github.run_number }}
          files: mobile_app/bin/*.apk
