# Gera o APK do placas na nuvem (buildozer nao roda no Windows).
# Buildozer instalado direto no runner (a action Docker de terceiros
# quebrou: "Docker build failed"). Runner pinado no 24.04 para fugir da
# migracao do ubuntu-latest para 26.04.
# - Push com mudanca em mobile_app/** OU botao Run workflow: builda o APK
#   debug, anexa como Artifact e publica Release (download direto,
#   sem login) por padrao.
# O APK debug instala com avisos do Play Protect (certificado debug).
# O release limpo (keystore proprio) entra depois via Secrets.

name: APK Placas

on:
  push:
    paths:
      - "mobile_app/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "Publicar Release (download direto no celular)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Copiar motor para mobile_app
        run: |
          cp Motor.py Main.py DetectarPlacas.py DetectarCaracteres.py \
             Preprocesso.py PossivelPlaca.py PossivelCaractere.py \
             classifications.txt flattened_images.txt \
             base_kNN_ampla.npy classes_kNN_ampla.npy mobile_app/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake \
            libffi-dev libssl-dev libltdl-dev

      - name: Instalar buildozer
        run: |
          pip install --user --break-system-packages \
            buildozer cython==0.29.33
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build APK debug
        working-directory: mobile_app
        run: buildozer android debug

      - name: Anexar APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: placas-debug
          path: mobile_app/bin/*.apk

      - name: Publicar Release
        # Publica por padrao (push); no disparo manual, desmarque a caixa
        # para publicar so o Artifact.
        if: ${{ inputs.release != false }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-debug-${{ github.run_number }}
          name: Placas debug ${{ github.run_number }}
          files: mobile_app/bin/*.apk
